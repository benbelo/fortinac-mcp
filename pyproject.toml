[project]
name = "fortinac-mcp"
version = "0.1.0"
description = "MCP server for FortiNAC rogue host diagnostics"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-nmap>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
